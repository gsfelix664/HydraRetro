[Main]
SettingsVersion = 1
EmulationSpeed = 1.000000
StartFullscreen = true
RenderToMainWindow = true
PauseOnFocusLoss = false
ConfirmPowerOff = false
SaveStateOnExit = false
ApplyGameSettings = true
ControllerBackend = SDL

[Console]
Region = Auto
AutoDetectDisc = true
Enable8MBRAM = false

[BIOS]
SearchDirectory = ../../BIOS
Path = 
AutoDetect = true

[Display]
CropMode = Overscan
ActiveStartOffset = 0
ActiveEndOffset = 0
AspectMode = Auto
LinearFiltering = true
IntegerScaling = false
Stretch = false
PostProcessing = false
ShowOSDMessages = true
ShowFPS = false
ShowSpeed = false
ShowResolution = false
ShowCPU = false
ShowGPU = false
ShowStatusIndicators = true
DisplayAllFrames = false
InternalResolutionScale = 1

[Audio]
Backend = Cubeb
BufferMS = 50
OutputVolume = 100
FastForwardVolume = 100
Muted = false

[Pad]
MultitapMode = Disabled
Type = AnalogController

[Pad1]
Type = AnalogController
Up = SDL-0/DPadUp, Keyboard/Up
Right = SDL-0/DPadRight, Keyboard/Right
Down = SDL-0/DPadDown, Keyboard/Down
Left = SDL-0/DPadLeft, Keyboard/Left
Triangle = SDL-0/Y, Keyboard/I
Circle = SDL-0/B, Keyboard/K
Cross = SDL-0/A, Keyboard/J
Square = SDL-0/X, Keyboard/U
Select = SDL-0/Back, Keyboard/Backspace
Start = SDL-0/Start, Keyboard/Return
L1 = SDL-0/LeftShoulder, Keyboard/Q
R1 = SDL-0/RightShoulder, Keyboard/E
L2 = SDL-0/+LeftTrigger, Keyboard/1
R2 = SDL-0/+RightTrigger, Keyboard/3
L3 = SDL-0/LeftStick, Keyboard/Z
R3 = SDL-0/RightStick, Keyboard/C
